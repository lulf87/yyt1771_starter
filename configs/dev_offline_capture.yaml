profile: dev_offline_capture
platform: mac
mode: offline
webapp:
  host: 127.0.0.1
  port: 8002
adapters:
  camera: offline_capture
  temp: offline_capture
  plc: mock
camera:
  offline_capture:
    capture_dir: examples/runtime/camera_captures/20260522-183158-dev_lab
    fixtures:
      - key: 20260522-183158-dev_lab
        label: Offline capture 20260522 18:31
        capture_dir: examples/runtime/camera_captures/20260522-183158-dev_lab
      - key: 20260529-194304-dev_lab
        label: Offline capture 20260529 19:43
        capture_dir: examples/runtime/camera_captures/20260529-194304-dev_lab
  trigger_mode: free_run
  pixel_format: mono8
  exposure_us: 50000
  gain_db: 12.0
  timeout_ms: 1000
  setup_preview:
    trigger_mode: free_run
    pixel_format: mono8
    exposure_us: 50000
    gain_db: 12.0
    timeout_ms: 1000
    device_roi:
      x: 0
      y: 0
      width: 2048
      height: 1364
  measurement:
    trigger_mode: free_run
    pixel_format: mono8
    exposure_us: 50000
    gain_db: 12.0
    timeout_ms: 1000
    device_roi:
      x: 0
      y: 0
      width: 2048
      height: 1364
temp:
  backend: offline_capture
  control:
    completion_mode: manual_stop_only
    startup_power_percent: 100.0
run:
  preview_poll_ms: 100
  capture_interval_ms: 100
  preview_target_fps: 10
  measurement_target_hz: 10
  artifact_capture_hz: 10
  manual_stop_max_samples: 0
  preview_display_max_width: 816
  preview_display_max_height: 544
  stop_on_invalid_tracking: false
  invalid_tracking_grace_samples: 5
storage:
  sqlite_path: examples/runtime/dev_offline_capture.sqlite3
  artifact_dir: examples/runtime/artifacts
