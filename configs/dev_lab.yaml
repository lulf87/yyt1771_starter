profile: dev_lab
platform: mac
mode: lab
webapp:
  host: 127.0.0.1
  port: 8000
adapters:
  camera: hik_gige_mvs
  temp: mock
  plc: mock
camera:
  transport: gige_vision
  sdk: hik_mvs
  probe_mode: protocol_any
  allowed_models: []
  serial_number: ""
  ip: ""
  trigger_mode: free_run
  pixel_format: mono8
  exposure_us: 10000
  gain_db: 0.0
  timeout_ms: 1000
  setup_preview:
    trigger_mode: free_run
    pixel_format: mono8
    exposure_us: 50000
    gain_db: 12.0
    timeout_ms: 1000
    device_roi:
      x: 512
      y: 342
      width: 2048
      height: 1364
  measurement:
    trigger_mode: free_run
    pixel_format: mono8
    exposure_us: 50000
    gain_db: 12.0
    timeout_ms: 1000
    device_roi:
      x: 512
      y: 342
      width: 2048
      height: 1364
temp:
  backend: mock
  control:
    completion_mode: manual_stop_only
    mock_ramp_step_celsius: 0.5
run:
  preview_poll_ms: 50
  capture_interval_ms: 100
  preview_target_fps: 20
  measurement_target_hz: 10
  artifact_capture_hz: 10
  manual_stop_max_samples: 0
  preview_display_max_width: 816
  preview_display_max_height: 544
  stop_on_invalid_tracking: false
  invalid_tracking_grace_samples: 5
storage:
  sqlite_path: examples/runtime/dev_lab.sqlite3
  artifact_dir: examples/runtime/artifacts
