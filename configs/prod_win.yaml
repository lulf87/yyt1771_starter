profile: prod_win
platform: windows
mode: production
webapp:
  host: 0.0.0.0
  port: 8080
adapters:
  camera: hik_gige_mvs
  temp: lu92xx_modbus_rtu
  plc: modbus_tcp
camera:
  transport: gige_vision
  sdk: hik_mvs
  probe_mode: pinned
  allowed_models:
    - MV-CU060-10GM
  serial_number: ""
  ip: ""
  trigger_mode: free_run
  pixel_format: mono8
  exposure_us: 10000
  gain_db: 0.0
  timeout_ms: 1000
  setup_preview:
    trigger_mode: free_run
    pixel_format: mono8
    exposure_us: 50000
    gain_db: 12.0
    timeout_ms: 1000
    device_roi:
      x: 512
      y: 342
      width: 2048
      height: 1364
  measurement:
    trigger_mode: free_run
    pixel_format: mono8
    exposure_us: 50000
    gain_db: 12.0
    timeout_ms: 1000
    device_roi:
      x: 512
      y: 342
      width: 2048
      height: 1364
temp:
  backend: lu92xx_modbus_rtu
  protocol: modbus_rtu
  slave_address: 1
  serial:
    port: COM5
    baudrate: 19200
    bytesize: 8
    parity: N
    stopbits: 1
    timeout_ms: 500
  register_map:
    process_value:
      function_code: 3
      start_address: 264
      register_count: 1
      signed: true
      decode_scale: 0.1
    target_or_stop_value:
      function_code: 6
      start_address: 0
      register_count: 1
      signed: true
      encode_scale: 10.0
    output_power:
      function_code: 6
      start_address: 4
      register_count: 1
      signed: false
      encode_scale: 256.0
  control:
    start_output_mode: power_nonzero
    startup_power_percent: 100.0
    completion_mode: target_reached
storage:
  sqlite_path: C:/yyt1771/data/prod.sqlite3
  artifact_dir: C:/yyt1771/artifacts
run:
  preview_poll_ms: 50
  capture_interval_ms: 100
  preview_target_fps: 20
  measurement_target_hz: 10
  artifact_capture_hz: 10
  manual_stop_max_samples: 0
  preview_display_max_width: 816
  preview_display_max_height: 544
  stop_on_invalid_tracking: false
  invalid_tracking_grace_samples: 5
logging:
  dir: C:/yyt1771/logs
