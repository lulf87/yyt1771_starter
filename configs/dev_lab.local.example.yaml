adapters:
  camera: hik_gige_mvs
  temp: lu92xx_modbus_rtu

camera:
  transport: gige_vision
  sdk: hik_mvs
  probe_mode: protocol_any
  allowed_models: []
  serial_number: ""
  ip: ""
  trigger_mode: free_run
  pixel_format: mono8
  exposure_us: 10000
  gain_db: 0.0
  timeout_ms: 1000
  setup_preview:
    trigger_mode: free_run
    pixel_format: mono8
    exposure_us: 50000
    gain_db: 12.0
    timeout_ms: 1000
    device_roi:
      x: 512
      y: 342
      width: 2048
      height: 1364
  measurement:
    trigger_mode: free_run
    pixel_format: mono8
    exposure_us: 50000
    gain_db: 12.0
    timeout_ms: 1000
    device_roi:
      x: 512
      y: 342
      width: 2048
      height: 1364

run:
  preview_poll_ms: 50
  preview_target_fps: 20
  manual_stop_max_samples: 0
  preview_display_max_width: 816
  preview_display_max_height: 544

temp:
  backend: lu92xx_modbus_rtu
  protocol: modbus_rtu
  slave_address: 1
  serial:
    port: /dev/cu.usbserial-0001
    baudrate: 19200
    bytesize: 8
    parity: N
    stopbits: 1
    timeout_ms: 500
  register_map:
    process_value:
      start_address: 264
      decode_scale: 0.1
    target_or_stop_value:
      start_address: 0
      encode_scale: 10.0
    output_power:
      start_address: 4
      encode_scale: 256.0
  control:
    start_output_mode: power_nonzero
    startup_power_percent: 100.0
    completion_mode: target_reached
