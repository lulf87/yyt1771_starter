[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yyt1771-starter"
version = "0.1.0"
description = "YY/T 1771 visual-analysis workstation baseline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pillow>=10.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "pyserial>=3.5",
]

[project.scripts]
yyt1771-desktop = "src.desktop_app.main:main"

[project.optional-dependencies]
desktop = [
    "PySide6_Essentials>=6.8",
    "shiboken6>=6.8",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
